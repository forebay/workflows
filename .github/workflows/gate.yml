name: Ecosystem invariants

on:
  workflow_call:
    inputs:
      tool_repository:
        description: 'owner/name of the repo holding the gate tool'
        required: false
        type: string
        default: 'forebay/npm-dual-publish'
      tool_ref:
        description: 'Ref of the tool repository; empty takes its default branch'
        required: false
        type: string
        default: ''
      clone_ref:
        description: 'Branch to clone each ecosystem repo at; empty takes each default branch'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Job timeout; raise it if the ecosystem sweep outgrows it'
        required: false
        type: number
        default: 45
    secrets:
      envPAT:
        description: 'Token the clones and the GitHub metadata reads are made with'
        required: false

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Require a token that can read the ecosystem
        id: preflight
        env:
          PAT: ${{ secrets.envPAT }}
          GH_TOKEN: ${{ secrets.envPAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::This gate reads other repositories, several of which are private, so the job token is not sufficient. Pass a PAT with repo read scope as the envPAT secret."
            exit 1
          fi
          if ! gh repo view "${{ inputs.tool_repository }}" --json name >/dev/null 2>&1; then
            echo "::error::The envPAT secret cannot read ${{ inputs.tool_repository }}. Check that the token has repo read scope and, if the org uses SAML, that it is SSO-authorized."
            exit 1
          fi
          # Resolved here rather than left to actions/checkout: with an empty ref the action looks
          # the default branch up through a REST path a fine-grained token may not answer, and the
          # run then dies with a bare "Not Found" naming no repository.
          tool_ref="${{ inputs.tool_ref }}"
          # A gate and the tool that implements it travel together: judging a development branch
          # with the tool from its default branch runs one set of rules against the other tree.
          if [ -z "$tool_ref" ] && [ -n "${{ inputs.clone_ref }}" ] \
              && gh api "repos/${{ inputs.tool_repository }}/branches/${{ inputs.clone_ref }}" >/dev/null 2>&1; then
            tool_ref="${{ inputs.clone_ref }}"
          fi
          if [ -z "$tool_ref" ]; then
            tool_ref=$(gh repo view "${{ inputs.tool_repository }}" --json defaultBranchRef -q .defaultBranchRef.name)
          fi
          echo "::notice::judging with the gate tool at $tool_ref"
          echo "tool_ref=$tool_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout the gate tool
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool_repository }}
          ref: ${{ steps.preflight.outputs.tool_ref }}
          path: tool
          submodules: recursive
          token: ${{ secrets.envPAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the gate tool
        working-directory: tool
        run: |
          npm install
          npm run build

      # The gates read cross-repo references, so they need the whole ecosystem laid out the way the
      # taxonomy declares it. No single repo's checkout can satisfy them.
      - name: Clone the ecosystem
        env:
          GH_TOKEN: ${{ secrets.envPAT || github.token }}
          CLONE_REF: ${{ inputs.clone_ref }}
        run: |
          mkdir -p tree
          node tool/dist/cli.js repo-meta layout --json > layout.json
          # The owner travels with each entry: the ecosystem spans two orgs, and assuming one
          # clones nothing for a repo that has moved.
          node -e 'for (const e of require("./layout.json")) console.log(e.dir + " " + e.repo + " " + e.owner)' \
            | while read -r dir repo owner; do
                mkdir -p "tree/$dir"
                if [ -n "$CLONE_REF" ] && gh repo clone "$owner/$repo" "tree/$dir/$repo" -- \
                    --branch "$CLONE_REF" --recurse-submodules; then
                  continue
                fi
                # A repo without that branch is judged at its default one rather than dropped: not
                # every repo carries a development branch, and a tree missing one repo is a tree the
                # cross-repo gates could pass by omission, which the count below refuses to allow.
                if [ -n "$CLONE_REF" ]; then
                  rm -rf "tree/$dir/$repo"
                  echo "::notice::$owner/$repo has no $CLONE_REF, judging its default branch"
                fi
                gh repo clone "$owner/$repo" "tree/$dir/$repo" -- --recurse-submodules \
                  || echo "::warning::skipped $owner/$repo"
              done
          find tree -maxdepth 2 -mindepth 2 -type d | sort
          expected=$(node -e 'console.log(require("./layout.json").length)')
          actual=$(find tree -maxdepth 2 -mindepth 2 -type d | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Cloned $actual of $expected repositories, so the gates would run on an incomplete tree and could pass by omission."
            exit 1
          fi

      - name: Run the invariant gates
        env:
          GH_TOKEN: ${{ secrets.envPAT || github.token }}
        run: |
          failed=""
          # Asked of the tool rather than listed here: this job clones the tool at its default
          # branch, so a list written in the workflow drifts the moment a gate is added there.
          # A tool too old to answer prints its usage instead, which the first-line check rejects.
          gates=$(node tool/dist/cli.js gates 2>/dev/null || true)
          case "$gates" in
            layer-check*) ;;
            *) gates="layer-check
          agnosticism-check
          workflow check
          repo-meta check
          repo-meta taxonomy" ;;
          esac
          while IFS= read -r gate; do
            # Unquoted, so the fallback list's YAML indentation is dropped along with it.
            gate=$(echo $gate)
            [ -n "$gate" ] || continue
            echo "::group::$gate"
            if node tool/dist/cli.js $gate --root tree; then
              echo "$gate: ok"
            else
              failed="$failed $gate"
            fi
            echo "::endgroup::"
          done <<< "$gates"
          if [ -n "$failed" ]; then
            echo "::error::gates failed:$failed"
            exit 1
          fi
